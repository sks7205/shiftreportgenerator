# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Injects the ARENA_API_KEY from GitHub Secrets into index.html prior to deployment.
      # Done in node rather than sed so a key containing & or | cannot corrupt the page.
      - name: Inject Secret into HTML
        env:
          ARENA_KEY: ${{ secrets.ARENA_API_KEY }}
        run: |
          if [ -z "$ARENA_KEY" ]; then
            echo "::warning::ARENA_API_KEY secret is not set - the deployed page will have no key and each device will have to paste one."
          fi
          node -e "const fs=require('fs');const k=process.env.ARENA_KEY||'';const f='index.html';fs.writeFileSync(f,fs.readFileSync(f,'utf8').split('__ARENA_API_KEY__').join(k));"
          if grep -q '__ARENA_API_KEY__' index.html; then echo "::error::placeholder still present after injection"; exit 1; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        # upload-pages-artifact v3 has no 'exclude' input, so stage the
        # publishable site explicitly instead of uploading the whole repo.
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the staged site - tests and dev config stay out of Pages
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
